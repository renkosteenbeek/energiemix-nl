services:
  app:
    image: sjc.vultrcr.com/gentle/energiemix-nl:latest
    container_name: energiemix-nl
    restart: unless-stopped
    env_file: .env
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge-energiemix-nl
      - traefik.http.routers.energiemix.rule=Host(`energiemix.gentle-innovations.nl`)
      - traefik.http.routers.energiemix.entrypoints=websecure
      - traefik.http.routers.energiemix.tls.certresolver=le
      - traefik.http.routers.energiemix.middlewares=security-headers@file
      - traefik.http.services.energiemix.loadbalancer.server.port=3000
      - traefik.http.services.energiemix.loadbalancer.serverstransport=traag@file

networks:
  edge:
    external: true
    name: edge-energiemix-nl
