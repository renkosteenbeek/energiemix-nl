name: Stroompeil

options:
  bundleIdPrefix: nl.gentleinnovations
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nl
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: 84TCAZ4665
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Stroompeil:
    type: application
    platform: iOS
    sources:
      - path: Stroompeil
      - path: Shared
    info:
      path: Stroompeil/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl]
        CFBundleDisplayName: Stroompeil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleURLTypes:
          - CFBundleURLName: nl.gentleinnovations.stroompeil
            CFBundleURLSchemes: [stroompeil]
    settings:
      base:
        PRODUCT_NAME: Stroompeil
        PRODUCT_BUNDLE_IDENTIFIER: nl.gentleinnovations.stroompeil
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: StroompeilWidget
        embed: true

  StroompeilWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StroompeilWidget
      - path: Shared
    info:
      path: StroompeilWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleLocalizations: [nl]
        CFBundleDisplayName: Stroompeil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: StroompeilWidget
        PRODUCT_BUNDLE_IDENTIFIER: nl.gentleinnovations.stroompeil.widget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES

  StroompeilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StroompeilTests
    dependencies:
      - target: Stroompeil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.gentleinnovations.stroompeil.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Stroompeil.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Stroompeil
        BUNDLE_LOADER: $(TEST_HOST)

  StroompeilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StroompeilUITests
    dependencies:
      - target: Stroompeil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.gentleinnovations.stroompeil.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Stroompeil

schemes:
  Stroompeil:
    build:
      targets:
        Stroompeil: all
        StroompeilWidget: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - StroompeilTests
        - StroompeilUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  StroompeilWidget:
    build:
      targets:
        StroompeilWidget: all
        Stroompeil: all
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: StroompeilWidget
        _XCWidgetDefaultView: timeline
        _XCWidgetFamily: systemMedium
    archive:
      config: Release
